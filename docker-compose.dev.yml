# Development overrides: live code reload for the application services.
#
# Not merged automatically (that would apply --reload during grading too).
# Use it explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis backend
#
services:
  backend:
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "true"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  face-recognition:
    volumes:
      - ./face-service:/app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
